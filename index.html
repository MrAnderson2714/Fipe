<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta Tabela FIPE</title>
  
  <!-- CORREÇÃO ERRO 1 e 3: Importação obrigatória das bibliotecas no <head> -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      --bg-dark: #0f1319;
      --card-bg: #161c24;
      --card-border: #232d39;
      --accent-blue: #00bcd4;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --red-alert: #5c1d24;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); padding: 20px; }

    /* Alerta de Erro Topo */
    #errorBanner {
      display: none;
      background-color: var(--red-alert);
      color: #fca5a5;
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 14px;
      border: 1px solid #7f1d1d;
    }

    /* Search Bar */
    .search-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .search-box input {
      width: 100%;
      padding: 12px 16px;
      background: #0f1319;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: #fff;
      font-size: 15px;
    }

    /* Grid Layout */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 300px 1fr 280px;
      gap: 20px;
      align-items: start;
    }

    /* CORREÇÃO ERRO 2: Sidebar com rolagem interna para não sumir/cortar menus */
    .sidebar {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 16px;
      max-height: calc(100vh - 180px); /* Evita extrapolar a tela */
      overflow-y: auto; /* Adiciona barra de rolagem */
    }

    .filter-group { margin-bottom: 16px; }
    .filter-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; font-weight: bold; }
    .filter-group select, .filter-group input {
      width: 100%;
      padding: 10px;
      background: #0f1319;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: #fff;
    }

    /* Lista de Versões com Scroll Próprio */
    .versions-list {
      max-height: 280px;
      overflow-y: auto;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      background: #0f1319;
    }
    .version-item {
      padding: 10px;
      border-bottom: 1px solid var(--card-border);
      cursor: pointer;
      font-size: 13px;
    }
    .version-item:hover, .version-item.active { background: #1f2937; color: var(--accent-blue); }

    /* Main Chart Card */
    .main-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 24px;
    }
    .vehicle-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
    .fipe-badge { background: #00838f; color: #fff; padding: 3px 8px; font-size: 11px; border-radius: 4px; font-weight: bold; }
    .vehicle-price { font-size: 28px; font-weight: bold; }

    /* CORREÇÃO ERRO 3: Container com altura definida para o Chart.js */
    .chart-container {
      position: relative;
      height: 320px;
      width: 100%;
      margin: 20px 0;
      background: #0f1319;
      border-radius: 6px;
      padding: 10px;
    }

    /* Stats Grid */
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 20px; }
    .stat-box { background: #0f1319; border: 1px solid var(--card-border); padding: 12px; border-radius: 6px; text-align: center; }
    .stat-box span { display: block; font-size: 11px; color: var(--text-muted); }
    .stat-box strong { font-size: 16px; color: #10b981; }

    /* Side Panel: Veículos Semelhantes */
    .similar-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 16px;
    }
    .similar-card h3 { font-size: 13px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 12px; }
    .similar-item {
      padding: 10px;
      background: #0f1319;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      margin-bottom: 8px;
    }
    .similar-item .name { font-size: 13px; font-weight: bold; margin-bottom: 4px; }
    .similar-item .price { font-size: 12px; color: var(--accent-blue); }
  </style>
</head>
<body>

  <!-- Alerta de Erro -->
  <div id="errorBanner"></div>

  <!-- Busca Superior -->
  <div class="search-box">
    <h3 style="margin-bottom: 8px;">Encontre seu veículo</h3>
    <input type="text" id="searchInput" placeholder="Ex.: Ford EcoSport, Civic, 038003-2...">
  </div>

  <!-- Grid Principal -->
  <div class="dashboard-grid">
    
    <!-- Painel Lateral / Filtros -->
    <div class="sidebar">
      <h4 style="margin-bottom: 16px; font-size: 14px;">REFINE SUA CONSULTA</h4>
      
      <div class="filter-group">
        <label>1. Tipo de Veículo</label>
        <select id="vehicleType">
          <option value="carro">Carro</option>
          <option value="moto">Moto</option>
          <option value="caminhao">Caminhão</option>
        </select>
      </div>

      <div class="filter-group">
        <label>2. Marca</label>
        <input type="text" id="brandInput" value="Ford">
      </div>

      <div class="filter-group">
        <label>3. Modelo</label>
        <input type="text" id="modelInput" value="EcoSport">
      </div>

      <div class="filter-group">
        <label>4. Versões / Códigos FIPE</label>
        <div class="versions-list" id="versionsList">
          <!-- Injetado dinamicamente -->
        </div>
      </div>
    </div>

    <!-- Painel Central / Gráfico e Detalhes -->
    <div class="main-card">
      <div class="vehicle-header">
        <div>
          <span class="fipe-badge" id="fipeCode">CÓDIGO FIPE 003374-0</span>
          <h2 style="margin-top: 8px;" id="vehicleTitle">EcoSport — TITANIUM 2.0 16V Flex 5p Aut.</h2>
          <small style="color: var(--text-muted);" id="vehicleSubtitle">Carro · Ford</small>
        </div>
        <div class="vehicle-price" id="vehiclePrice">R$ 76.152</div>
      </div>

      <!-- CORREÇÃO ERRO 3: Elemento Canvas do Chart.js -->
      <div class="chart-container">
        <canvas id="chartDepreciacao"></canvas>
      </div>

      <div class="stats-grid">
        <div class="stat-box"><span>Média do histórico</span><strong>+25.06%</strong></div>
        <div class="stat-box"><span>Últimos 3 períodos</span><strong>+27.13%</strong></div>
        <div class="stat-box"><span>Últimos 6 períodos</span><strong>+47.28%</strong></div>
        <div class="stat-box"><span>Últimos 12 períodos</span><strong>+50.97%</strong></div>
      </div>
    </div>

    <!-- Painel Direito: Veículos Semelhantes (CORREÇÃO ERRO 4) -->
    <div class="similar-card">
      <h3>VEÍCULOS DE PREÇO SEMELHANTE</h3>
      <div id="similaresContainer">
        <!-- Injetado via JS -->
      </div>
    </div>

  </div>

  <script>
    // Base de dados simulada/fallback para garantir que o app funcione independente do Excel
    let baseDados = [
      { codigoFipe: "003374-0", marca: "Ford", modelo: "EcoSport", versao: "TITANIUM 2.0 16V Flex 5p Aut.", ano: 2018, valor: 76152, historico: [52000, 58000, 64000, 71000, 76152] },
      { codigoFipe: "003472-0", marca: "Ford", modelo: "EcoSport", versao: "100 Anos 1.5 Flex 5p Aut.", ano: 2019, valor: 72842, historico: [50000, 55000, 61000, 68000, 72842] },
      { codigoFipe: "003438-0", marca: "Ford", modelo: "EcoSport", versao: "FREESTYLE 1.5 12V Flex 5p Aut.", ano: 2020, valor: 75494, historico: [53000, 59000, 65000, 70000, 75494] },
      { codigoFipe: "021005-1", marca: "Honda", modelo: "Civic", versao: "LXR 2.0 Flexone 16V Aut.", ano: 2016, valor: 74200, historico: [51000, 56000, 62000, 69000, 74200] },
      { codigoFipe: "005382-1", marca: "Volkswagen", modelo: "T-Cross", versao: "200 TSI 1.0 Flex Aut.", ano: 2020, valor: 78900, historico: [60000, 65000, 70000, 74000, 78900] },
      { codigoFipe: "004412-2", marca: "Chevrolet", modelo: "Tracker", versao: "LT 1.4 Turbo Flex Aut.", ano: 2018, valor: 73500, historico: [51000, 57000, 63000, 68000, 73500] }
    ];

    let myChart = null;

    // CORREÇÃO ERRO 1: Tenta carregar fipe.xlsx com tratamento de exceção seguro
    async function carregarPlanilha() {
      const errorBanner = document.getElementById('errorBanner');
      try {
        if (typeof XLSX === 'undefined') throw new Error("Biblioteca SheetJS (XLSX) não foi carregada.");
        if (typeof Chart === 'undefined') throw new Error("Chart is not defined");

        const response = await fetch('fipe.xlsx');
        if (!response.ok) throw new Error("Não foi possível acessar fipe.xlsx na pasta raiz.");

        const arrayBuffer = await response.arrayBuffer();
        const workbook = XLSX.read(arrayBuffer, { type: 'array' });
        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
        const parsedData = XLSX.utils.sheet_to_json(firstSheet);

        if (parsedData && parsedData.length > 0) {
          // Atualiza base com a planilha se encontrada
          baseDados = parsedData;
        }
        errorBanner.style.display = 'none';
      } catch (err) {
        // Exibe erro na tela mas mantém a aplicação legível usando dados de fallback
        errorBanner.style.display = 'block';
        errorBanner.innerHTML = `<strong>Atenção:</strong> Não foi possível carregar fipe.xlsx. Detalhe: ${err.message}`;
      } finally {
        inicializarApp();
      }
    }

    function inicializarApp() {
      renderizarListaVersoes();
      selecionarVeiculo(baseDados[0]);
    }

    function renderizarListaVersoes() {
      const container = document.getElementById('versionsList');
      container.innerHTML = '';

      baseDados.forEach(carro => {
        const item = document.createElement('div');
        item.className = 'version-item';
        item.innerHTML = `<strong>${carro.versao}</strong><br><small>${carro.ano} · R$ ${carro.valor.toLocaleString('pt-BR')}</small>`;
        item.onclick = () => selecionarVeiculo(carro);
        container.appendChild(item);
      });
    }

    function selecionarVeiculo(veiculo) {
      document.getElementById('fipeCode').innerText = `CÓDIGO FIPE ${veiculo.codigoFipe}`;
      document.getElementById('vehicleTitle').innerText = `${veiculo.modelo} — ${veiculo.versao}`;
      document.getElementById('vehicleSubtitle').innerText = `Carro · ${veiculo.marca}`;
      document.getElementById('vehiclePrice').innerText = `R$ ${veiculo.valor.toLocaleString('pt-BR')}`;

      // CORREÇÃO ERRO 3: Renderiza o gráfico via Chart.js
      renderizarGrafico(veiculo.historico || [50000, 55000, 60000, 70000, veiculo.valor]);

      // CORREÇÃO ERRO 4: Calcula e renderiza os veículos semelhantes
      renderizarVeiculosSemelhantes(veiculo);
    }

    // CORREÇÃO ERRO 3: Criação/Atualização do Chart.js
    function renderizarGrafico(dadosHistorico) {
      const ctx = document.getElementById('chartDepreciacao').getContext('2d');

      if (myChart) {
        myChart.destroy(); // Destrói instância anterior para evitar erros de renderização
      }

      myChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: ['2020', '2021', '2022', '2023', '2024'],
          datasets: [{
            label: 'Evolução do Preço (R$)',
            data: dadosHistorico,
            borderColor: '#00bcd4',
            backgroundColor: 'rgba(0, 188, 212, 0.1)',
            fill: true,
            tension: 0.3
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { color: '#232d39' }, ticks: { color: '#9ca3af' } },
            y: { grid: { color: '#232d39' }, ticks: { color: '#9ca3af' } }
          }
        }
      });
    }

    // CORREÇÃO ERRO 4: Filtra veículos na faixa de preço ±10%
    function renderizarVeiculosSemelhantes(veiculoAtual) {
      const container = document.getElementById('similaresContainer');
      container.innerHTML = '';

      const min = veiculoAtual.valor * 0.85; // Margem de -15%
      const max = veiculoAtual.valor * 1.15; // Margem de +15%

      const semelhantes = baseDados.filter(c => 
        c.codigoFipe !== veiculoAtual.codigoFipe && 
        c.valor >= min && 
        c.valor <= max
      );

      if (semelhantes.length === 0) {
        container.innerHTML = '<small style="color: var(--text-muted)">Nenhum veículo similar encontrado na mesma faixa de preço.</small>';
        return;
      }

      semelhantes.slice(0, 4).forEach(v => {
        const card = document.createElement('div');
        card.className = 'similar-item';
        card.style.cursor = 'pointer';
        card.innerHTML = `
          <div class="name">${v.marca} ${v.modelo}</div>
          <div class="price">R$ ${v.valor.toLocaleString('pt-BR')} · ${v.ano}</div>
        `;
        card.onclick = () => selecionarVeiculo(v);
        container.appendChild(card);
      });
    }

    window.onload = carregarPlanilha;
  </script>
</body>
</html>
